server.port=8080

# C\u1EA5u hình MySQL (Thay root và 123456 b\u1EB1ng m\u1EADt kh\u1EA9u MySQL c\u1EE7a b\u1EA1n)
spring.datasource.url=jdbc:mysql://localhost:3306/estatebasic?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# C\u1EA5u hình Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
