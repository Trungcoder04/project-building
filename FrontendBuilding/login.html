<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập System - EstateBasic Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
        }

        .login-banner {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="row g-0">
            <!-- Left Banner -->
            <div class="col-md-5 login-banner d-none d-md-flex">
                <div>
                    <a href="index.html" class="text-white text-decoration-none d-flex align-items-center gap-2 fs-4 fw-bold mb-4">
                        <i class="fa-solid fa-city"></i> EstateBasic
                    </a>
                    <h2 class="fw-bold mb-3">Hệ Thống Quản Trị Bất Động Sản</h2>
                    <p class="text-white-50">Dành riêng cho Quản lý & Nhân viên kinh doanh quản lý Tòa nhà, Khách hàng và Giao dịch.</p>
                </div>

                <div class="pt-4 border-top border-white-50">
                    <p class="small mb-0 text-white-50"><i class="fa-solid fa-shield-halved me-1"></i> Bảo mật RESTful API & JWT Token</p>
                </div>
            </div>

            <!-- Right Login Form -->
            <div class="col-md-7 p-4 p-md-5">
                <div class="mb-4">
                    <h3 class="fw-bold text-dark mb-1">Đăng Nhập Tài Khoản</h3>
                    <p class="text-muted small">Vui lòng nhập tên đăng nhập và mật khẩu để tiếp tục.</p>
                </div>

                <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label-custom">Tên đăng nhập (Username)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" id="username" class="form-control form-control-custom border-start-0" placeholder="Nhập username (ví dụ: manager)" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label-custom">Mật khẩu (Password)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" id="password" class="form-control form-control-custom border-start-0" placeholder="Nhập mật khẩu (ví dụ: 123)" required>
                        </div>
                    </div>

                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe" checked>
                            <label class="form-check-label small text-muted" for="rememberMe">Ghi nhớ đăng nhập</label>
                        </div>
                        <a href="index.html" class="small text-primary fw-semibold"><i class="fa-solid fa-house me-1"></i> Về Trang chủ</a>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 fw-bold">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng Nhập Hệ Thống
                    </button>
                </form>

                <!-- Quick Presets Demo -->
                <div class="mt-4 pt-4 border-top">
                    <div class="text-muted small mb-2 fw-bold text-uppercase">Dùng thử nhanh (Quick Demo Logins):</div>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-outline-warning text-dark btn-sm fw-semibold text-start px-3" onclick="quickLogin('manager', '123')">
                            <i class="fa-solid fa-user-shield me-2 text-warning"></i> Đăng nhập làm <strong>MANAGER (Quản Lý)</strong>
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-sm fw-semibold text-start px-3" onclick="quickLogin('staff1', '123')">
                            <i class="fa-solid fa-user-tie me-2 text-primary"></i> Đăng nhập làm <strong>STAFF (Nhân Viên Business)</strong>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- App Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/mockData.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Redirect if already logged in
            if (Auth.isLoggedIn()) {
                window.location.href = 'admin.html';
                return;
            }

            const form = document.getElementById('loginForm');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;
                    await doLogin(username, password);
                });
            }
        });

        async function quickLogin(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
            await doLogin(u, p);
        }

        async function doLogin(u, p) {
            const alertEl = document.getElementById('loginAlert');
            alertEl.classList.add('d-none');

            try {
                await ApiService.login(u, p);
                window.location.href = 'admin.html';
            } catch (err) {
                alertEl.textContent = err.message || 'Đăng nhập thất bại!';
                alertEl.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
